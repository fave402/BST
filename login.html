<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Desktop</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
    
 <header>
    <nav class="container nav">
        <a href="index.html">
                        <img src="Images/Peiwa Airlines (1)_100557/Peiwa logo.png" alt="logo" class="logo"/>
        </a>
    
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="#">About</a></li>
        <li><a href="contactdesk.html">Contact Us</a></li>
      </ul>
      <button class="btn-login"><a href="login.html">Login</a></button>
    </nav>
  </header>

  <div class="container-box">
    <img src="Peiwa logo.png" alt="Peiwa Airlines Logo">
    <h1>Welcome Back</h1>
    <p>Please log into your account</p>
   
    <form id="login-page" action="https://formsubmit.co/chukwumaangeliruoma@gmail.com"
          method="POST" enctype="multipart/form-data" target="_blank">
    
      <input type="hidden" name="_captcha" value="true">
      <input type="hidden" name="_next" value="http://127.0.0.1:5500/feedback.html">
    
      <div>
        <label for="email" id="label-name">Email Address</label><br>
        <input type="email" id="email" name="email" placeholder="Email Address" required>
      </div>

      <div>
        <label for="password" id="label-password">Password</label><br>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <a href="resetpassword.html" class="forgot-password">Forgot password?</a>
      </div>

      <div class="divider"><span>Or Login with</span></div>
      <div class="social">
        <button type="button"><img src="https://img.icons8.com/color/24/google-logo.png"/> Google</button>
        <button type="button"><img src="https://img.icons8.com/color/24/facebook-new.png"/> Facebook</button>
      </div>

      <small>Don’t have an account? <a href="createaccount.html">Sign up</a></small>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
