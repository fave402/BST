<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account </title>
    <link rel="stylesheet" href="createaccount.css" />
</head>
<body>

    <nav>
         <img src="Peiwa logo.png" alt="Peiwa Airlines Logo">
        <ul class="nav-links">
            <li>Home</li>
            <li>Services</li>
            <li>About</li>
            <li>Contact Us</li>
        </ul>
    </nav>

    <div class="container">
       <img src="Peiwa logo.png" alt="Peiwa Airlines Logo">
    <h1>Create An Account</h1>
    <h5>Please log into your account</h5>
   
    <form id="login-page" action="https://formsubmit.co/chukwumaangeliruoma@gmail.com"
        method="POST" enctype="multipart/form-data" target="_blank">
    
    <input type="hidden" name="_captcha" value="true">
    <input type="hidden" name="_next" value="http://127.0.0.1:5500/feedback.html">
    
    <div>
        <input type="email" id="name" name="email" placeholder="Email Address" required >
    </div>

    <div>
        <input type="password" id="password" name="password" placeholder="password" required >
    </div>

    <div class="input">
        <input type="password" id="confirm-password" name="confirm-password" placeholder="confirm-password" required >
    </div>

    <button>Sign Up</button>

    <div class="divider"><span>Or Signup with</span></div>
    <div class="social">
      <button><img src="https://img.icons8.com/color/24/google-logo.png"/> Google</button>
      <button><img src="https://img.icons8.com/color/24/facebook-new.png"/> Facebook</button>
    </div>
    <small>Don’t disclose your account information to anyone</small>
  </div>
    </form>
    </div>
    

   
</body>
</html>
